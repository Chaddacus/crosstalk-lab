# Merge gate through the shared rapid-dev workflow (Chaddacus/dev-standards).
# Playwright e2e (npm run test:e2e) stays a local check.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    uses: Chaddacus/dev-standards/.github/workflows/check.yml@v1
    with:
      node-version: "24"
      setup-command: npm ci
      check-command: npm run typecheck && npm test && npm run lint:data && npm run build
