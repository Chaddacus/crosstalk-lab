# Per-PR preview on GitHub Pages: https://chaddacus.github.io/crosstalk-lab/pr-preview/pr-<n>/
# Previews live on the gh-pages branch under pr-preview/ and are removed when the PR closes.
# One-time repo setup (owner): Settings > Pages > Deploy from branch gh-pages (root), and
# Settings > Actions > General > Workflow permissions > Read and write.
# If a main-branch Pages site is added later, its deploy must keep pr-preview/ (for example
# JamesIves/github-pages-deploy-action with clean-exclude: pr-preview/).
name: preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Forks get a read-only token, so the deploy cannot run for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "24"
          cache: npm
      - name: Build under the preview path
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build
        env:
          CROSSTALK_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./dist/
