# Per-PR preview on GitHub Pages (gh-pages branch, under pr-preview/pr-<n>/).
# The action comments the link on the PR and removes the preview when the PR closes.
# One-time owner step: Settings > Pages > deploy from branch gh-pages, folder / (root).
name: pr-preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    # Fork PRs get a read-only token, so the deploy cannot run for them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "24"
          cache: npm
      - name: Build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: dist
          umbrella-dir: pr-preview
